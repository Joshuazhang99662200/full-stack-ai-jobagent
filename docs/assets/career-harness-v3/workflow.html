<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CareerHarness 求职工作链路</title>
  <meta name="description" content="已确认证据支持岗位匹配与材料准备，消息和附件经本人审批后执行，真实结果进入下一轮改进。">
  <link rel="stylesheet" href="workflow.css">
</head>
<body>
<main>
<figure id="workflow" aria-labelledby="workflow-title">
  <header><h1 id="workflow-title">求职工作链路</h1><p>已确认的经历支撑每次申请，真实结果用于下一轮改进。</p></header>
  <div class="map">
    <svg class="connections" viewBox="0 0 1152 664" aria-hidden="true">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9"/></marker>
      </defs>
      <g class="flow-links">
        <path d="M248 56H312"/>
        <path d="M560 56H632"/>
        <path d="M248 328H312"/>
        <path d="M540 328H568V272H600"/>
        <path d="M568 328V416H600"/>
        <path d="M840 272H872V328H904"/>
        <path d="M840 416H872V328" class="no-arrow"/>
        <path d="M1028 384V512"/>
        <path d="M904 564H840"/>
        <path d="M600 564H540"/>
        <path d="M312 564H248"/>
        <path d="M124 512V424"/>
      </g>
      <g class="evidence-links">
        <path d="M892 144V184H426V238"/>
        <path d="M892 184H720V216"/>
      </g>
      <path class="reapproval" d="M1084 384V496H872V328"/>
    </svg>
    <section class="node prep"><h2>协同接入准备</h2><p>简历、目标与硬条件<br>选择浏览器 / MCP<br>预先验收完整 JD 补齐</p></section>
    <section class="node confirmation"><h2>本人列表确认</h2><p>编号事实、原文与页码<br>可一次确认明确的一组</p></section>
    <section class="node evidence"><h2>已确认证据</h2><p>岗位匹配、招呼、回复与定向简历共用同一份事实。</p></section>
    <span class="wire-label evidence-label">复用事实依据</span>
    <section class="node sources"><div><h2>先读已有对话</h2><p>恢复状态，读来信待办</p></div><div><h2>再找新岗位</h2><p>保留来源、时间并去重</p></div></section>
    <section class="node matching"><h2>完整 JD 与匹配</h2><p>先筛硬条件，再看<br>证据、缺口与风险</p><p class="small">待判断项交本人裁决</p></section>
    <div class="materials">
      <section class="node greeting"><h2>招呼 / 回复</h2><p>按岗位起草，独立复核</p></section>
      <section class="node resume"><h2>定向简历</h2><p>索取简历 / 本人决定推进<br>改写、复核、检查成品</p></section>
    </div>
    <section class="node approval"><h2>本人逐项审批</h2><p>准确消息全文<br>与实际简历附件</p><p class="small mobile-approval-note">内容改变，重新审批</p></section>
    <span class="wire-label retry-label">内容改变<br>重新审批</span>
    <section class="node execution"><h2>执行 / 人工交接</h2><p>发送前再核验内容与文件</p></section>
    <section class="node receipt"><h2>回读结果与跟进</h2><p>回执、版本、回复、面试<br>结果不明，先核实</p></section>
    <section class="node metrics"><h2>漏斗统计与诊断</h2><p>触达、已读不回<br>简历发出后的约面</p></section>
    <section class="node rules"><h2>规则改进与复核</h2><p>本人确认改动与范围<br>后续验证效果，再调整</p></section>
    <span class="wire-label loop-label">进入下一轮</span>
    <p class="mobile-return">回到已有对话与新岗位，继续观察确认后的规则效果。</p>
  </div>
  <figcaption>新规则不改写候选人事实，也不替代发送审批。<br>工作流说明图；渠道统一编排与运营分支的实现范围见 README。</figcaption>
</figure>
</main>
</body>
</html>
