<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerHarness 暖色流程图手机版</title><meta name="description" content="协同准备、岗位与对话、材料、人工审批和投后运营的图标流程图。"><link rel="stylesheet" href="mobile.css"></head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="doc" viewBox="0 0 32 32"><path d="M8 3 24 4 25 29 7 28Z"/><path d="m12 11 9 .3m-9 6 9 .3m-9 6 7 .2"/></symbol>
<symbol id="browser" viewBox="0 0 32 32"><path d="m3 5 26 1-1 23-25-1Z"/><path d="m3 12 25 .5m-20-4h.1m4 0h.1m4 0h.1"/></symbol>
<symbol id="person" viewBox="0 0 32 32"><ellipse cx="15" cy="9" rx="6" ry="6"/><path d="M4 29v-6c0-10 23-10 23 0v6Z"/></symbol>
<symbol id="book" viewBox="0 0 32 32"><path d="M16 6C11 2 5 3 2 5l1 23c4-2 9-2 13 1 4-3 9-3 14-1l-1-23c-4-2-8-2-13 1Zm0 0v23M6 10l6 1m-6 5 6 1m8-6 6-1m-6 7 6-1"/></symbol>
<symbol id="chat" viewBox="0 0 32 32"><path d="M4 4h23v20H14l-8 6v-6H3Z"/><path d="M9 14h.1m6 0h.1m6 0h.1"/></symbol>
<symbol id="search" viewBox="0 0 32 32"><ellipse cx="13" cy="13" rx="10" ry="10"/><path d="m20 21 9 8"/></symbol>
<symbol id="check" viewBox="0 0 32 32"><path d="m16 2 12 5-2 15-10 8L5 21 3 7Z"/><path d="m9 15 5 6 10-12"/></symbol>
<symbol id="send" viewBox="0 0 32 32"><path d="m2 14 28-12-8 28-7-10-13-6Zm13 6L30 2"/></symbol>
<symbol id="receipt" viewBox="0 0 32 32"><path d="M6 2h21v28l-5-3-5 3-5-3-6 3Z"/><path d="m11 10 11 .3m-11 6 11 .3m-11 6 5 .2"/></symbol>
<symbol id="funnel" viewBox="0 0 32 32"><path d="M2 4h28L20 17v11l-7 3V17Z"/></symbol>
<symbol id="chart" viewBox="0 0 32 32"><path d="M3 28h27M5 18h5v10H5Zm9-7h5v17h-5Zm9-8h5v25h-5Z"/></symbol>
<symbol id="loop" viewBox="0 0 32 32"><path d="M27 12A12 12 0 0 0 5 8L2 13m0-9v9h9M5 20a12 12 0 0 0 22 4l3-5m0 9v-9h-9"/></symbol>
</defs></svg>
<figure id="mobile-workflow">
<header><h1>CareerHarness</h1><p>AI 求职工作流</p></header>
<section class="stage"><h2><span>1</span> 协同准备</h2>
<div class="two"><div class="item"><svg aria-hidden="true"><use href="#doc"/></svg><h3>资料与目标</h3></div><div class="item"><svg aria-hidden="true"><use href="#browser"/></svg><h3>渠道预检</h3></div></div>
<p class="note">简历、经历、硬条件；浏览器 / MCP 与完整 JD 补齐。</p>
<div class="two confirmation"><div class="item"><svg aria-hidden="true"><use href="#person"/></svg><h3>本人确认事实</h3></div><div class="item"><svg aria-hidden="true"><use href="#book"/></svg><h3>已确认证据</h3></div></div>
<p class="note">编号列表可确认一组，保留原文与页码。</p></section>
<div class="down" aria-hidden="true">↓</div>
<section class="stage"><h2><span>2</span> 岗位与对话</h2>
<div class="two"><div class="item"><svg aria-hidden="true"><use href="#chat"/></svg><h3>先读已有对话</h3></div><div class="item"><svg aria-hidden="true"><use href="#search"/></svg><h3>再找新岗位</h3></div></div>
<div class="merge" aria-hidden="true">↓</div>
<div class="inline"><svg aria-hidden="true"><use href="#funnel"/></svg><div><h3>完整 JD 与匹配</h3><p>硬条件、证据、缺口与风险</p></div></div>
<p class="evidence-note">匹配与材料准备，共用已确认证据。</p></section>
<div class="down" aria-hidden="true">↓</div>
<section class="stage material"><h2><span>3</span> 材料准备</h2>
<div class="branches"><div class="branch"><div class="item"><svg aria-hidden="true"><use href="#chat"/></svg><h3>招呼 / 回复</h3></div><div class="merge" aria-hidden="true">↓</div><p>独立复核</p></div><div class="branch"><div class="item"><svg aria-hidden="true"><use href="#doc"/></svg><h3>定向简历</h3></div><p class="condition">索取简历或本人决定推进</p><div class="merge" aria-hidden="true">↓</div><p>复核与成品检查</p></div></div>
</section>
<div class="down" aria-hidden="true">↓</div>
<section class="stage execution"><h2><span>4</span> 确认与执行</h2>
<div class="approval inline"><svg aria-hidden="true"><use href="#person"/></svg><div><h3>本人逐项审批</h3><p>准确全文 + 实际附件</p></div></div>
<p class="recheck">内容改变，重新审批。</p>
<div class="action"><svg aria-hidden="true"><use href="#check"/></svg><h3>发送前核验</h3></div><div class="merge" aria-hidden="true">↓</div>
<div class="action"><svg aria-hidden="true"><use href="#send"/></svg><h3>执行 / 人工交接</h3></div><div class="merge" aria-hidden="true">↓</div>
<div class="action"><svg aria-hidden="true"><use href="#receipt"/></svg><h3>回读与记账</h3></div>
</section>
<div class="down" aria-hidden="true">↓</div>
<section class="stage"><h2><span>5</span> 运营与改进</h2>
<div class="operations">
<div class="operation"><svg aria-hidden="true"><use href="#funnel"/></svg><h3>观察转化</h3><p>已读不回<br>简历后约面</p></div>
<div class="operation"><svg aria-hidden="true"><use href="#chart"/></svg><h3>诊断与提案</h3></div>
<div class="operation owner"><svg aria-hidden="true"><use href="#person"/></svg><h3>本人确认规则</h3></div>
<div class="operation effect"><svg aria-hidden="true"><use href="#loop"/></svg><h3>复核后续效果</h3></div>
</div>
<p class="return"><svg aria-hidden="true"><use href="#loop"/></svg><span>进入下一轮<br>回到已有对话与新岗位</span></p>
</section>
<figcaption>流程示意；能力与版本见 README。</figcaption>
</figure>
</body></html>
