[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "full-stack-ai-jobagent"
version = "0.4.0"
description = "Evidence-grounded, human-approved AI job hunting capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.11,<3",
  "pypdf>=6.14,<7",
  "PyYAML>=6,<7",
  "typer>=0.16,<1",
]

[project.scripts]
jobagent = "jobagent.cli.app:app"

[project.optional-dependencies]
# Resume rendering (`jobagent optimizer render`); layout only, never content.
render = [
  "python-docx>=1.1,<2",
  "reportlab>=5,<6",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "python-docx>=1.1,<2",
  "reportlab>=5,<6",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["jobagent"]

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
follow_imports = "skip"

# Optional rendering dependencies ship no type information.
[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*", "docx", "docx.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.hatch.build.targets.wheel.force-include]
"skills/job-hunting" = "jobagent/optimizer/resources/job-hunting"
