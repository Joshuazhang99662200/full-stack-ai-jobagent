schema_version: "1.0"
entries:
  - id: repo.candidate.parse-resume
    version: 1.0.0
    kind: capability
    description: "Outcome: returns a typed ParsedResume with pages, warnings, and content digest. Trigger: a candidate supplies a PDF resume. Excludes: cannot interpret or invent candidate facts. Output: one ParsedResume."
    entrypoint: jobagent.parsing.pdf_resume:PdfResumeParser.parse
    input_schema: ResumeParseInput
    output_schema: ResumeParseOutput
    intents:
      - parse_candidate_resume
    required_context:
      - resume_source
    permissions:
      read:
        - resume_source
      write: []
    preconditions:
      - phase2_adapter_available
      - readable_pdf_resume
    dependencies:
      - policy.optimizer.evidence
      - policy.optimizer.failure-handling
    produces:
      - ParsedResume
    verifiers: []
    failure_policy:
      retry: never
      fallback: return_typed_failure
    trust: core

  - id: repo.candidate.detect-gaps
    version: 1.0.0
    kind: capability
    description: "Outcome: identifies material evidence gaps. Trigger: candidate readiness is evaluated for a target role. Excludes: cannot promote evidence automatically. Output: prioritized gaps for an interview turn."
    entrypoint: jobagent.candidate.gaps:GapDetector.detect
    input_schema: CandidateGapDetectionInput
    output_schema: CandidateGapDetectionOutput
    intents:
      - detect_candidate_evidence_gaps
    required_context:
      - candidate_profile
      - candidate_evidence
      - target_role
    permissions:
      read:
        - candidate_profile
        - candidate_evidence
        - target_role
      write: []
    preconditions:
      - phase2_adapter_available
      - candidate_profile_available
    dependencies:
      - policy.optimizer.evidence
      - policy.optimizer.prompt-routing
    produces:
      - CandidateGap
    verifiers: []
    failure_policy:
      retry: never
      fallback: return_typed_failure
    trust: core

  - id: repo.candidate.ask-question
    version: 1.0.0
    kind: capability
    description: "Outcome: selects one focused evidence question. Trigger: a prioritized candidate gap needs clarification. Excludes: cannot ask multiple questions or promote facts. Output: one InterviewQuestion."
    entrypoint: jobagent.candidate.interview:AdaptiveInterview.next_question
    input_schema: CandidateQuestionInput
    output_schema: CandidateQuestionOutput
    intents:
      - ask_one_evidence_question
    required_context:
      - candidate_gap
      - target_role
      - recent_gap_ids
    permissions:
      read:
        - candidate_gap
        - target_role
      write: []
    preconditions:
      - phase2_adapter_available
      - prioritized_gap_available
    dependencies:
      - policy.optimizer.evidence
      - policy.optimizer.prompt-routing
    produces:
      - InterviewQuestion
    verifiers: []
    failure_policy:
      retry: never
      fallback: pause_for_human
    trust: core

  - id: repo.candidate.add-draft-evidence
    version: 1.0.0
    kind: capability
    description: "Outcome: records an unconfirmed evidence proposal. Trigger: new candidate facts arrive through current feedback. Excludes: cannot promote canonical evidence or assume truth. Output: draft evidence with provenance."
    entrypoint: jobagent.candidate.evidence:CandidateEvidenceService.add_draft
    input_schema: DraftEvidenceInput
    output_schema: DraftEvidenceOutput
    intents:
      - record_draft_candidate_evidence
    required_context:
      - user_feedback
    permissions:
      read:
        - user_feedback
      write:
        - draft_evidence
    preconditions:
      - phase2_adapter_available
      - candidate_fact_supplied
    dependencies:
      - policy.optimizer.evidence
    produces:
      - draft_evidence
    verifiers: []
    failure_policy:
      retry: never
      fallback: pause_for_human
    trust: core

  - id: repo.candidate.confirm-evidence
    version: 1.0.0
    kind: capability
    description: "Outcome: promotes verified facts into canonical evidence. Trigger: the candidate explicitly confirms a draft fact. Excludes: never performs silent, inferred, or bulk promotion. Output: a confirmed EvidenceItem retaining its original source."
    entrypoint: jobagent.candidate.evidence:CandidateEvidenceService.confirm
    input_schema: ConfirmEvidenceInput
    output_schema: ConfirmEvidenceOutput
    intents:
      - confirm_candidate_evidence
    required_context:
      - draft_evidence
      - user_feedback
    permissions:
      read:
        - draft_evidence
        - user_feedback
      write:
        - canonical_evidence
    preconditions:
      - phase2_adapter_available
      - explicit_user_confirmation
    dependencies:
      - policy.optimizer.evidence
    produces:
      - canonical_evidence
    verifiers: []
    failure_policy:
      retry: never
      fallback: pause_for_human
    trust: core

  - id: repo.jobs.extract-requirements
    version: 1.0.0
    kind: capability
    description: "Outcome: extracts structured job requirements. Trigger: a normalized job record has usable JD text. Excludes: cannot score candidates or rewrite resumes. Output: a provenance-bound job requirement profile."
    entrypoint: jobagent.reasoning.job_requirements:ReasoningJobRequirementExtractor.extract
    input_schema: JobRequirementExtractionInput
    output_schema: JobRequirementExtractionOutput
    intents:
      - extract_job_requirements
    required_context:
      - job_record
    permissions:
      read:
        - job_record
      write: []
    preconditions:
      - phase2_adapter_available
      - usable_job_description
    dependencies:
      - policy.optimizer.prompt-routing
      - policy.optimizer.workflow
    produces:
      - job_requirements
    verifiers: []
    failure_policy:
      retry: transient_once
      fallback: return_typed_failure
    trust: core

  - id: repo.jobs.match-evidence
    version: 1.0.0
    kind: capability
    description: "Outcome: maps admissible candidate evidence to requirements. Trigger: a requirement profile and confirmed evidence are available. Excludes: cannot invent claims or mutate resumes. Output: explainable requirement matches."
    entrypoint: jobagent.reasoning.job_matcher:ReasoningJobMatcher.map
    input_schema: JobEvidenceMatchInput
    output_schema: JobEvidenceMatchOutput
    intents:
      - match_evidence_to_requirements
    required_context:
      - job_record
      - candidate_evidence
      - job_requirements
    permissions:
      read:
        - job_record
        - candidate_evidence
        - job_requirements
      write: []
    preconditions:
      - phase2_adapter_available
      - job_requirements_available
    dependencies:
      - policy.optimizer.evidence
      - policy.optimizer.quality-gates
    produces:
      - requirement_matches
    verifiers: []
    failure_policy:
      retry: transient_once
      fallback: return_typed_failure
    trust: core

  - id: repo.jobs.refresh-intelligence
    version: 1.0.0
    kind: capability
    description: "Outcome: catalogs a future intelligence refresh adapter as Phase 1 metadata only. Trigger: existing-job optimizer scope requests fresh intelligence. Excludes: cannot execute because the current workflow includes discovery and persistence. Output: job intelligence after the Phase 2 adapter exists."
    entrypoint: jobagent.jobs.workflow:JobIntelligenceWorkflow.run
    input_schema: JobIntelligenceRefreshInput
    output_schema: JobIntelligenceRefreshOutput
    intents:
      - refresh_job_intelligence
    required_context:
      - job_search_query
      - candidate_profile
      - candidate_evidence
      - filter_context
      - policies
      - source
    permissions:
      read:
        - candidate_profile
        - candidate_evidence
      write:
        - job_intelligence
    preconditions:
      - phase2_refresh_adapter_available
      - existing_job_scope
    dependencies:
      - policy.optimizer.failure-handling
      - policy.optimizer.workflow
      - repo.jobs.extract-requirements
      - repo.jobs.match-evidence
    produces:
      - job_intelligence
    verifiers: []
    failure_policy:
      retry: transient_once
      fallback: return_typed_failure
    trust: core

  - id: repo.optimizer.contracts
    version: 1.0.0
    kind: policy
    description: "Outcome: defines the optimizer workflow contract. Trigger: optimizer orchestration needs lifecycle boundaries. Excludes: cannot execute behavior or grant new authority. Output: workflow constraints for later routing."
    entrypoint: references/optimizer/contracts.md
    input_schema: null
    output_schema: null
    intents:
      - inspect_optimizer_contracts
    required_context: []
    permissions:
      read:
        - optimizer_contracts
      write: []
    preconditions: []
    dependencies: []
    produces: []
    verifiers: []
    failure_policy:
      retry: never
      fallback: return_typed_failure
    trust: core
